name: Hourly Fringe review scan

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hourly-fringe-review-scan
  cancel-in-progress: false

jobs:
  full-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the Ledger
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install the locked dependencies
        run: npm ci

      - name: Reconcile every British Comedy Guide show page
        run: node scripts/reconcile-bcg.mjs app/bcg-reviews.json

      - name: Reconcile every Quinntessential Review archive page
        run: node scripts/reconcile-theqr.mjs app/theqr-reviews.json

      - name: Reconcile Fest and The Skinny directly
        run: node scripts/reconcile-fest-skinny.mjs app/direct-reviews.json

      - name: Reconcile official EdFringe genres and ticket pages
        run: node scripts/reconcile-edfringe.mjs app/edfringe-listings.json

      - name: Audit every listed publication
        run: node scripts/audit-sources.mjs app/source-audit.json

      - name: Detect verified review-data changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- app/bcg-reviews.json app/theqr-reviews.json app/direct-reviews.json app/edfringe-listings.json app/page.tsx; then
            echo "verified_data=false" >> "$GITHUB_OUTPUT"
          else
            echo "verified_data=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and render the current Ledger
        run: |
          npm run build
          node scripts/render-cloudflare-static.mjs

      - name: Record the scan, movers and new entries
        run: node scripts/update-scan-history.mjs

      - name: Rebuild with the latest scan record
        run: |
          npm run build
          node scripts/render-cloudflare-static.mjs

      - name: Publish the latest scan status
        env:
          SCAN_STATUS_URL: ${{ vars.SCAN_STATUS_URL }}
          SCAN_STATUS_TOKEN: ${{ secrets.SCAN_STATUS_TOKEN }}
        run: node scripts/publish-scan-status.mjs

      - name: Publish verified site changes to Cloudflare Pages
        if: steps.changes.outputs.verified_data == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy work/cloudflare-static --project-name fringe-ledger-edinburgh --branch main

      - name: Save the audit trail for the next comparison
        shell: bash
        run: |
          git config user.name "Fringe Ledger scanner"
          git config user.email "scanner@users.noreply.github.com"
          git add app/bcg-reviews.json app/theqr-reviews.json app/direct-reviews.json app/source-audit.json app/scan-history.json app/edfringe-listings.json
          if git diff --cached --quiet; then
            echo "No generated files changed."
          else
            git commit -m "Update hourly Fringe review scan"
            git push
          fi
